[package]
name = "open-daw"
version = "0.1.1"
description = "open-daw desktop shell"
authors = ["open-daw contributors"]
license = "MIT"
repository = "https://github.com/ChristianCra/open-daw"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "open_daw_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4" }

[dependencies]
tauri = { version = "2.12.5", features = ["devtools"] }
